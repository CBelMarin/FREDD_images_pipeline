# Pipeline configuration: fill in once, before the first run.
# Absolute paths are recommended. Lines starting with # are comments.

[dossiers]
# Folder(s) containing the images: the folder that CONTAINS the batches or the centers
# (never a patient folder itself). Several folders: separate with ;
images =
# CSV export of the patient data (separator ; or ,)
donnees =
# Output folder: OUTSIDE any synchronized folder; plan for several tens of GB.
# Keep the SAME folder from one run to the next: only new images are then processed.
sortie =

[colonnes]
# Column holding the patient pseudonym in the CSV
identifiant = id
# Column holding the center (used for the images_traitees/<center>/ filing)
centre = center_name
# Column preset for the eCRF reconciliation ("fredd" = preset of the FREDD eCRF)
skezia = fredd

[options]
# Images per call of the pixel-processing module
taille_paquet = 200
# Process only a sample of patients: path of echantillon_patients.csv (see "fredd.py echantillon"). Empty = all.
echantillon =
# Extra options for pipeline_fredd.py (see python pipeline_fredd.py --help)
autres =
